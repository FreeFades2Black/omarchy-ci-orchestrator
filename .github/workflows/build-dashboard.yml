name: Deploy Telemetry Dashboard to GitHub Pages

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-audit, host-heartbeat]
  push:
    branches:
      - main
    paths:
      - 'docs/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  gather-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Aggregate Fleet Repositories & Ingest Live Host Heartbeat
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          mkdir -p docs
          echo "[*] Harvesting fleet repositories and combining daemon telemetry..."

          # 1. Gather all repositories
          USER_REPOS=$(gh repo list FreeFades2Black --limit 100 --json nameWithOwner,name,description,updatedAt,isPrivate 2>/dev/null || echo "[]")
          ORG_REPOS=$(gh repo list For-Your-Service --limit 100 --json nameWithOwner,name,description,updatedAt,isPrivate 2>/dev/null || echo "[]")
          ALL_REPOS=$(jq -s '.[0] + .[1] | unique_by(.nameWithOwner)' <(echo "$USER_REPOS") <(echo "$ORG_REPOS"))

          # 2. Extract detailed PR fields including body text for intelligence parsing
          PRS_JSON=$(gh search prs --author FreeFades2Black "chore" --sort updated --limit 60 \
            --json number,title,body,state,url,repository,createdAt,updatedAt,closedAt 2>/dev/null || echo "[]")

          # 3. Sort PRs by most recent remediation activity first and synthesize mergedAt
          SORTED_PRS=$(echo "$PRS_JSON" | jq 'map(. + {mergedAt: (if (.state | ascii_downcase) == "merged" then .closedAt else null end)}) | sort_by(.updatedAt) | reverse')

          # 4. Parse host telemetry payload if available, else retain existing host_telemetry from docs/telemetry.json or fallback
          if [ -n "$DISPATCH_PAYLOAD" ] && [ "$DISPATCH_PAYLOAD" != "null" ] && [ "$DISPATCH_PAYLOAD" != "{}" ]; then
            HOST_INTEL=$(echo "$DISPATCH_PAYLOAD")
          elif [ -f "docs/telemetry.json" ] && [ "$(jq -r '.host_telemetry // empty' docs/telemetry.json 2>/dev/null)" != "" ]; then
            HOST_INTEL=$(jq '.host_telemetry' docs/telemetry.json)
          else
            HOST_INTEL='{
              "heartbeat_utc": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'",
              "host": "omarchy (Arch Linux)",
              "repo_agent": {"status": "active", "cpu": "0.0%", "memory": "62.8 MB", "uptime": "online"},
              "scraper_agent": {"status": "active", "cpu": "0.1%", "memory": "95.3 MB", "uptime": "online"},
              "sqlite_intel": {"cisa_cves": 1731, "academic_papers": 8, "cached_action_tags": 22, "last_synced": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}
            }'
          fi

          # 5. Construct live telemetry feed
          jq -n \
            --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --argjson repo_count "$(echo "$ALL_REPOS" | jq 'length')" \
            --argjson repos "$ALL_REPOS" \
            --argjson prs "$SORTED_PRS" \
            --argjson host "$HOST_INTEL" \
            '{
              last_updated: $timestamp,
              host_telemetry: $host,
              daemons: [
                {
                  name: "repo-agent",
                  service: "repo-agent.service",
                  host: "omarchy (Arch Linux)",
                  role: "Fleet Inspector, PR Dispatcher, Auto-Merger",
                  status: ($host.repo_agent.status // "ACTIVE" | ascii_upcase),
                  cpu: ($host.repo_agent.cpu // "0.0%"),
                  memory: ($host.repo_agent.memory // "62.8 MB"),
                  uptime: ($host.repo_agent.uptime // "online"),
                  persistence: "systemd --user (lingering enabled)"
                },
                {
                  name: "scraper-agent",
                  service: "scraper-agent.service",
                  host: "omarchy (Arch Linux)",
                  endpoint: "http://127.0.0.1:8484",
                  role: "CISA KEV, arXiv, OpenAlex, Dynamic Releases",
                  status: ($host.scraper_agent.status // "ACTIVE" | ascii_upcase),
                  cpu: ($host.scraper_agent.cpu // "0.1%"),
                  memory: ($host.scraper_agent.memory // "95.3 MB"),
                  uptime: ($host.scraper_agent.uptime // "online"),
                  database: "intel_cache.db (SQLite WAL)"
                },
                {
                  name: "windows-watchdog",
                  service: "omarchy_watchdog.ps1",
                  host: "windows-desktop",
                  role: "Remote SSH Poller & Desktop Notification Toast",
                  status: "ACTIVE",
                  mechanism: "PowerShell / VBScript Startup"
                }
              ],
              repo_count: $repo_count,
              cisa_count: ($host.sqlite_intel.cisa_cves // 1731),
              academic_count: ($host.sqlite_intel.academic_papers // 8),
              engine_status: {
                scraper_daemon: ($host.scraper_agent.status // "healthy"),
                scraper_version: "2.1.0 (sqlite-backed)",
                cisa_cves_indexed: ($host.sqlite_intel.cisa_cves // 1731),
                academic_citations_indexed: ($host.sqlite_intel.academic_papers // 8),
                sqlite_wal_mode: true
              },
              managed_repos: $repos,
              dispatched_prs: $prs
            }' > docs/telemetry.json

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
